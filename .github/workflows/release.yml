name: Release

# Push a tag like v1.2.0 (or v1.2.0-beta.1) to publish a GitHub Release. Notes come from the
# matching CHANGELOG.md section; the web edition build is attached as a zip.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload its asset

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./frontend/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match frontend/package.json ($pkg)"
            exit 1
          fi
      - name: Test and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build:web
        env:
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - name: Package the web edition
        run: |
          cd frontend/dist
          zip -r "../../pixora-web-${GITHUB_REF_NAME}.zip" .
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "pixora-web-${GITHUB_REF_NAME}.zip" \
            --title "Pixora $GITHUB_REF_NAME" --notes-file notes.md --verify-tag $flags
