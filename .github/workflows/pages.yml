name: Deploy web edition to GitHub Pages

# Every push to main publishes the browser-only web edition. Checks must pass first.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time; a newer push waits instead of cancelling a running deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build web edition
        run: npm run build:web
        env:
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - name: Check the build output
        run: |
          test -f dist/index.html
          grep -q 'Content-Security-Policy' dist/index.html
          ls dist/assets/*.js >/dev/null
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish to GitHub Pages
      id-token: write # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Report
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
