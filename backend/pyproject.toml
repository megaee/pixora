[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "photo-cleanup"
version = "1.0.0b1"
description = "Pixora: sort photos into categories and similar sets, pick the best, clean up storage."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pillow>=10.4",
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.18"]
# AI mode: local DINOv2 grouping + CLIP-IQA quality (~1 GB of packages, models ~700 MB on first use)
ai = [
    "torch>=2.2",
    "transformers>=4.45",
    "numpy>=1.26",
    "scipy>=1.11",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    # AI grouping logic is tested with a fake model, so CI needs these but not torch
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.scripts]
pixora = "photo_cleanup.cli:main"
photo-cleanup = "photo_cleanup.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/photo_cleanup"]

# the built UI is git-ignored but must ship inside the wheel
artifacts = ["src/photo_cleanup/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
