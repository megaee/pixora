[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "photo-cleanup"
version = "0.1.0"
description = "Find similar photos, pick the best, and clean up storage with a review web UI."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pillow>=10.4",
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.18"]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
photo-cleanup = "photo_cleanup.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/photo_cleanup"]

# the built UI is git-ignored but must ship inside the wheel
artifacts = ["src/photo_cleanup/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
